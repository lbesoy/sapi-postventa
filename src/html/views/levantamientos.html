              </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="window.setFiltroEstadoLevantamientos('Completado')">

              <div>
                <div class="stat-label">Completados</div>
                <div class="stat-value" id="stat-lev-completados">0</div>
              </div>
            </div>

          <div class="desktop-only-search" style="margin-bottom:1rem; display:flex;">

                  <th>Cliente</th>
                  <th>Sitio</th>
                  <th>Solicitante</th>
                  <th>Asignado A</th>
                  <th>Fecha Esperada</th>
                  <th>Estado</th>

            <div class="mobile-search-bar mobile-lev-search-bar">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="mobile-search-levantamientos" placeholder="Buscar folio, cliente, sitio..." oninput="window.syncSearchLevantamientos(this.value)" autocomplete="off" />
              <button type="button" class="mobile-search-clear" id="btn-clear-search-lev" onclick="window.clearSearchLevantamientos()" style="display:none;" title="Limpiar búsqueda">
                <i data-lucide="x"></i>
              </button>

            <div class="mobile-status-chips-scroll mobile-lev-chips-scroll" id="mobile-levantamientos-chips">

                <span>Todos</span>
                <span class="chip-count" id="mob-lev-total">0</span>
              </button>
              <button type="button" class="status-chip chip-red" data-estado="Pendiente" onclick="window.setFiltroEstadoLevantamientos('Pendiente', this)">

                <span class="chip-count" id="mob-lev-pendientes">0</span>

              <button type="button" class="status-chip chip-green" data-estado="Completado" onclick="window.setFiltroEstadoLevantamientos('Completado', this)">

                <span class="chip-count" id="mob-lev-completados">0</span>

          <div class="mobile-only-lev-container" id="mobile-levantamientos-cards-container">
