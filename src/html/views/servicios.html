        <div id="view-servicios" class="view">

              <div>
                <div class="stat-label">Total Órdenes</div>
                <div class="stat-value" id="stat-serv-total">0</div>
              </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="setFiltroEstadoServicios('Pendiente')">
              <div class="stat-icon" style="background:rgba(239,68,68,0.12);color:#ef4444;"><i data-lucide="alert-circle"></i></div>
              <div>
                <div class="stat-label">Pendientes</div>
                <div class="stat-value" id="stat-serv-pendientes">0</div>
              </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="setFiltroEstadoServicios('En proceso')">
              <div class="stat-icon" style="background:rgba(232,130,12,0.12);color:#E8820C;"><i data-lucide="clock"></i></div>
              <div>
                <div class="stat-label">En Proceso</div>
                <div class="stat-value" id="stat-serv-proceso">0</div>
              </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="setFiltroEstadoServicios('Refacciones pendientes')">
              <div class="stat-icon" style="background:rgba(236,72,153,0.12);color:#ec4899;"><i data-lucide="package"></i></div>

                <div class="stat-label">Refacciones Pendientes</div>
                <div class="stat-value" id="stat-serv-refacciones-pendientes">0</div>
              </div>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="setFiltroEstadoServicios('Completado')">
              <div class="stat-icon" style="background:rgba(16,185,129,0.12);color:#10b981;"><i data-lucide="check-circle"></i></div>
              <div>
                <div class="stat-label">Completadas</div>
                <div class="stat-value" id="stat-serv-completas">0</div>
              </div>
            </div>

              <div class="servicios-actions-row">
                <div class="search-bar mobile-search-bar">

                </div>
                <div class="servicios-action-buttons">
                  <button type="button" id="btn-exportar-ordenes-excel" class="btn-secondary btn-exportar-compact" onclick="window.exportarOrdenesAExcel()" title="Exportar lista actual de órdenes de servicio a Excel (.xlsx)">
                    <i data-lucide="download" style="width:14px; height:14px;"></i> <span class="btn-text-export">Exportar</span>
                  </button>
                  <button class="action-btn btn-regenerar-compact" onclick="regenerarOrdenesDesdeTickets()"
                    id="btn-regenerar-ordenes"
                    title="Regenerar Órdenes desde Tickets Cerrados"
                    style="display:none;">
                    <i data-lucide="refresh-cw" class="btn-icon" style="width:14px;height:14px;"></i> <span class="btn-text-regen">Regenerar</span>
                  </button>
                  <button class="action-btn btn-depurar-compact" onclick="window.abrirModalDepurarOrdenes()"
                    id="btn-depurar-ordenes-ref"
                    title="Depurar Órdenes de Refacciones y Garantías (Superadmin)"
                    style="display:none;">
                    <i data-lucide="trash-2" class="btn-icon" style="width:14px;height:14px;"></i> <span class="btn-text-depurar">Depurar</span> (<span id="badge-count-ordenes-ref">0</span>)
                  </button>
                </div>
              </div>

            <div class="mobile-status-chips-scroll" id="mobile-ordenes-chips">

                <span class="chip-count" id="chip-count-total">0</span>
              </button>
              <button type="button" class="status-chip chip-amber" data-estado="En proceso" onclick="window.setFiltroEstadoServiciosChip('En proceso', this)">

                <span>En Proceso</span>
                <span class="chip-count" id="chip-count-proceso">0</span>
              </button>
              <button type="button" class="status-chip chip-red" data-estado="Pendiente" onclick="window.setFiltroEstadoServiciosChip('Pendiente', this)">
                <span class="chip-dot dot-red"></span>
                <span>Pendientes</span>
                <span class="chip-count" id="chip-count-pendientes">0</span>
              </button>
              <button type="button" class="status-chip chip-pink" data-estado="Refacciones pendientes" onclick="window.setFiltroEstadoServiciosChip('Refacciones pendientes', this)">
                <span class="chip-dot dot-pink"></span>
                <span>Refacciones</span>
                <span class="chip-count" id="chip-count-refacciones">0</span>
              </button>
              <button type="button" class="status-chip chip-green" data-estado="Completado" onclick="window.setFiltroEstadoServiciosChip('Completado', this)">
                <span class="chip-dot dot-green"></span>
                <span>Completadas</span>
                <span class="chip-count" id="chip-count-completas">0</span>

                  <th>Ticket</th>
                  <th id="th-ord-cliente" onclick="toggleSortOrdenes('cliente')" style="cursor:pointer; user-select:none;">Cliente </th>

                  <th id="th-ord-modelo" onclick="toggleSortOrdenes('modelo')" style="cursor:pointer; user-select:none;">Modelo </th>
                  <th id="th-ord-tecnico" onclick="toggleSortOrdenes('tecnico')" style="cursor:pointer; user-select:none;">Responsables </th>
                  <th id="th-ord-tipo" onclick="toggleSortOrdenes('tipo')" style="cursor:pointer; user-select:none;">Tipo </th>
                  <th id="th-ord-estado" onclick="toggleSortOrdenes('estado')" style="cursor:pointer; user-select:none;">Estado </th>
                  <th id="th-ord-fecha" onclick="toggleSortOrdenes('fecha')" style="cursor:pointer; user-select:none;">Fecha </th>
                  <th style="width: 40px; text-align:center;"></th>

              </thead>
              <tbody id="tabla-body-servicios">
                <tr>
                  <td colspan="11" class="empty-state">Sin órdenes aún.</td>
                </tr>
              </tbody>

          </div>
