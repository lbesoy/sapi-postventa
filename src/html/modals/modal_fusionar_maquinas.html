    <!-- MODAL FUSIONAR MAQUINAS -->
    <div class="modal-overlay" id="modal-fusionar-maquinas-overlay" onclick="cerrarModalFusionarMaquinas(event)" style="z-index: 500;">
      <div class="modal" style="max-width:500px;">
        <div class="modal-header">
          <h2><i data-lucide="git-merge" style="vertical-align:middle; margin-right:6px; color:var(--accent);"></i> Fusionar Maquinarias</h2>
          <button class="modal-close" onclick="cerrarModalFusionarMaquinas()">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem; line-height:1.4; text-align:left;">
            Esta herramienta permite unificar dos maquinarias duplicadas. Las órdenes, levantamientos y lecturas de horómetros de la máquina duplicada se transferirán a la máquina principal seleccionada, y luego la máquina duplicada será eliminada permanentemente.
          </p>
          <form id="form-fusionar-maquinas" onsubmit="fusionarMaquinarias(event)">
            <div class="form-section">
              <div class="form-group" style="margin-bottom: 1rem; text-align:left;">
                <label style="font-weight:600; color:var(--red); display:block; margin-bottom:0.25rem;">1. Máquina Duplicada (Origen - Se eliminará) *</label>
                <select id="fm-maquina-origen" class="view-filter" style="width:100%; font-size:0.85rem;" required>
                  <option value="">Selecciona la máquina a eliminar...</option>
                </select>
              </div>
              
              <div class="form-group" style="margin-bottom: 1rem; text-align:left;">
                <label style="font-weight:600; color:var(--green); display:block; margin-bottom:0.25rem;">2. Máquina Principal (Destino - Se conservará) *</label>
                <select id="fm-maquina-destino" class="view-filter" style="width:100%; font-size:0.85rem;" required>
                  <option value="">Selecciona la máquina a conservar...</option>
                </select>
              </div>

              <div style="background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 6px; padding: 0.75rem; margin-top: 1.25rem; text-align:left;">
                <label style="display:flex; align-items:flex-start; gap:0.5rem; cursor:pointer; font-size:0.8rem; color:var(--text-primary); font-weight:normal; margin:0;">
                  <input type="checkbox" id="fm-confirmar" required style="margin-top:0.15rem; cursor:pointer;" />
                  <span>Entiendo que esta acción es permanente y no se puede deshacer. Se reasignarán las relaciones en la base de datos de producción.</span>
                </label>
              </div>
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
              <button type="button" class="btn-secondary" onclick="cerrarModalFusionarMaquinas()">Cancelar</button>
              <button type="submit" class="btn-primary" style="background:var(--red); border-color:var(--red); color:white;">Fusionar Maquinaria</button>
            </div>
          </form>
        </div>
      </div>
    </div>
