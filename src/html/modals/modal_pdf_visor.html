  <div id="modal-pdf-visor" style="display:none; position:fixed; inset:0; background:rgba(10,12,18,0.8); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:2rem; box-sizing:border-box;">
    <div style="background:var(--bg-primary); border:1px solid var(--border); border-radius:12px; width:100%; max-width:1100px; height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
      
      <!-- Header -->
      <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:var(--bg-hover);">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <div style="width:28px; height:28px; border-radius:4px; background:rgba(239,68,68,0.1); color:var(--red); display:flex; justify-content:center; align-items:center;">
            <i data-lucide="file-text" style="width:16px; height:16px;"></i>
          </div>
          <div>
            <h3 style="margin:0; font-size:0.9rem; font-weight:700; color:var(--text-primary);" id="pdf-visor-title">Visor de Comprobante PDF</h3>
            <span style="font-size:0.68rem; color:var(--text-muted);" id="pdf-visor-subtitle">Visualización nativa y Ficha SAT de 26 Campos</span>
          </div>
        </div>
        <button type="button" onclick="window.cerrarPdfVisor()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:4px; border-radius:50%; transition:var(--transition);" onmouseover="this.style.color='var(--text-primary)'; this.style.background='var(--bg-hover)';" onmouseout="this.style.color='var(--text-muted)'; this.style.background='none';">
          <i data-lucide="x" style="width:20px; height:20px;"></i>
        </button>
      </div>

      <!-- Content Split Pane -->
      <div style="display:grid; grid-template-columns: 1.2fr 1fr; flex:1; overflow:hidden; min-height:0;">
        
        <!-- Left: PDF Embed Frame -->
        <div style="border-right:1px solid var(--border); background:#12141c; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:0.5rem;">
          <embed id="pdf-visor-frame" type="application/pdf" style="width:100%; height:100%; border-radius:6px;" src="" />
          <div id="pdf-visor-error" style="display:none; color:var(--text-secondary); text-align:center; padding:2rem;">
            <i data-lucide="alert-circle" style="width:32px; height:32px; color:var(--accent); margin:0 auto 0.5rem;"></i>
            <p style="margin:0; font-size:0.85rem;">La previsualización no está disponible en este navegador.</p>
            <a id="pdf-visor-download-link" href="#" target="_blank" class="btn-secondary" style="margin-top:0.75rem; display:inline-flex; align-items:center; gap:4px; font-size:0.75rem; padding:0.35rem 0.65rem; min-height:auto;">Descargar Archivo</a>
          </div>
        </div>

        <!-- Right: SAT 26 Fields Accordion/Table -->
        <div style="overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:1rem; background:var(--bg-primary);">
          <div style="display:flex; align-items:center; gap:0.4rem; border-bottom:1px dashed var(--border); padding-bottom:0.65rem;">
            <i data-lucide="sparkles" style="width:15px; height:15px; color:var(--accent);"></i>
            <h4 style="margin:0; font-size:0.8rem; font-weight:700; color:var(--text-primary); text-transform:uppercase; letter-spacing:0.03em;">Ficha SAT Extraída del PDF</h4>
          </div>
          <div id="pdf-visor-sat-body" style="font-size:0.75rem;">
            <!-- Rendered accordion SAT table -->
          </div>
        </div>

      </div>

    </div>
  </div>
