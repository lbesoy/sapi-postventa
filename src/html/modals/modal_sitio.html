  <!-- MODAL AGREGAR SITIO -->
  <div class="modal-overlay" id="modal-agregar-sitio-overlay" onclick="cerrarModalSitio(event)" style="z-index: 300;">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 id="modal-sitio-title">Nuevo Sitio</h2>
        <button class="modal-close" onclick="cerrarModalSitio()">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-agregar-sitio" onsubmit="guardarSitioCliente(event)">
          <input type="hidden" id="s-cliente-nombre" />
          <div class="form-group" id="s-cliente-group" style="display:none; margin-bottom:0.75rem;">
            <label>Empresa / Cliente *</label>
            <select id="s-cliente-select" class="form-select" style="width:100%; height:38px; border-radius:4px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-primary); font-size:0.85rem; padding:0 0.5rem; outline:none; cursor:pointer;">
              <option value="">Selecciona un cliente...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nombre del Sitio *</label>
            <input type="text" id="s-sitio-nombre" placeholder="Ej. Planta Norte, Bodega 3, etc." required />
          </div>
          <div class="form-group" style="margin-top:0.75rem;">
            <label>Dirección</label>
            <input type="text" id="s-sitio-direccion" placeholder="Calle, número, colonia, etc." />
          </div>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-top:0.75rem;">
            <div class="form-group">
              <label>Código Postal</label>
              <input type="text" id="s-sitio-cp" placeholder="Ej. 11000" />
            </div>
            <div class="form-group">
              <label>Ciudad / Municipio</label>
              <input type="text" id="s-sitio-ciudad" placeholder="Ej. Miguel Hidalgo" />
            </div>
            <div class="form-group" style="grid-column:1/-1;">
              <label>Estado</label>
              <select id="s-sitio-estado">
                <option value="">Selecciona un estado</option>
                <option value="Aguascalientes">Aguascalientes</option>
                <option value="Baja California">Baja California</option>
                <option value="Baja California Sur">Baja California Sur</option>
                <option value="Campeche">Campeche</option>
                <option value="Chiapas">Chiapas</option>
                <option value="Chihuahua">Chihuahua</option>
                <option value="Ciudad de México">Ciudad de México</option>
                <option value="Coahuila">Coahuila</option>
                <option value="Colima">Colima</option>
                <option value="Durango">Durango</option>
                <option value="Estado de México">Estado de México</option>
                <option value="Guanajuato">Guanajuato</option>
                <option value="Guerrero">Guerrero</option>
                <option value="Hidalgo">Hidalgo</option>
                <option value="Jalisco">Jalisco</option>
                <option value="Michoacán">Michoacán</option>
                <option value="Morelos">Morelos</option>
                <option value="Nayarit">Nayarit</option>
                <option value="Nuevo León">Nuevo León</option>
                <option value="Oaxaca">Oaxaca</option>
                <option value="Puebla">Puebla</option>
                <option value="Querétaro">Querétaro</option>
                <option value="Quintana Roo">Quintana Roo</option>
                <option value="San Luis Potosí">San Luis Potosí</option>
                <option value="Sinaloa">Sinaloa</option>
                <option value="Sonora">Sonora</option>
                <option value="Tabasco">Tabasco</option>
                <option value="Tamaulipas">Tamaulipas</option>
                <option value="Tlaxcala">Tlaxcala</option>
                <option value="Veracruz">Veracruz</option>
                <option value="Yucatán">Yucatán</option>
                <option value="Zacatecas">Zacatecas</option>
              </select>
            </div>
          </div>
          <div class="form-actions" style="margin-top:1.5rem;">
            <button type="button" class="btn-secondary" onclick="cerrarModalSitio()">Cancelar</button>
            <button type="submit" class="btn-primary">Agregar Sitio</button>
          </div>
        </form>
      </div>
    </div>
  </div>
