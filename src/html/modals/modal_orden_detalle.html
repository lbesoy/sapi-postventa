    <!-- MODAL DETALLE -->
    <div class="modal-overlay" id="modal-detalle-overlay">
      <div class="modal modal-app-fullscreen" id="modal-detalle">
        <div class="modal-header modal-detail-header">
          <div class="modal-header-top-row">
            <button type="button" class="modal-nav-back-btn" onclick="cerrarDetalle()" aria-label="Volver">
              <i data-lucide="arrow-left"></i>
            </button>
            <div class="modal-title-box">
              <h2 id="detalle-title">Orden de Servicio</h2>
              <span id="detalle-header-status-badge" class="detalle-header-badge" style="display:none;"></span>
            </div>
            <button type="button" class="modal-close" onclick="cerrarDetalle()" aria-label="Cerrar">✕</button>
          </div>
          <div id="detalle-header-actions" class="detalle-actions-scroll">
            <button class="btn-primary" id="btn-cerrar-orden-admin"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;background:#059669;border-color:#059669;color:#fff;"
              onclick="confirmarCierreOrdenAdmin()"><i data-lucide="check-circle-2" class="btn-icon"></i> Cerrar Orden</button>
            <button class="btn-secondary" id="btn-reabrir-orden-admin"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;color:#d97706;border-color:#d97706;"
              onclick="confirmarReaperturaOrdenAdmin()"><i data-lucide="rotate-ccw" class="btn-icon"></i> Reabrir Orden</button>
            <button class="btn-primary" id="btn-cierre-papel"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;background:#4f46e5;border-color:#4f46e5;color:#fff;"
              onclick="abrirCierrePapel()"><i data-lucide="file-text" class="btn-icon"></i> Cierre en Papel</button>
            <button class="btn-primary" id="btn-completar-reporte"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;"
              onclick="completarReporteDesdeDetalle(window.currentDetalleOrdenId)"><i data-lucide="file-edit" class="btn-icon"></i> Llenar Reporte Técnico</button>
            <button class="btn-primary" id="btn-asignar-tecnicos"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;background:var(--accent);border-color:var(--accent);color:#fff;"
              onclick="abrirAsignarTecnicos()"><i data-lucide="users" class="btn-icon"></i> Asignar Técnicos</button>
            <button class="btn-secondary" id="btn-enviar-correo"
              style="font-size:0.8rem;padding:0.4rem 0.8rem;display:flex;align-items:center;gap:0.35rem;color:#10b981;border-color:#10b981;"
              onclick="enviarCorreoOrden()"><i data-lucide="mail" class="btn-icon"></i> Enviar</button>
            <button class="btn-secondary" id="btn-imprimir-orden"
              style="font-size:0.8rem;padding:0.4rem 0.8rem;display:flex;align-items:center;gap:0.35rem;"
              onclick="imprimirOrden()"><i data-lucide="printer" class="btn-icon"></i> Imprimir</button>
          </div>
        </div>
        <div class="modal-body" id="detalle-body"></div>
      </div>
    </div>
