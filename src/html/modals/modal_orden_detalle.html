    <!-- MODAL DETALLE -->
    <div class="modal-overlay" id="modal-detalle-overlay" onclick="cerrarDetalle(event)" style="z-index: 500;">
      <div class="modal" id="modal-detalle">
        <div class="modal-header">
          <h2 id="detalle-title">Orden de Servicio</h2>
          <div style="display:flex;gap:0.5rem;align-items:center;" id="detalle-header-actions">
            <button class="btn-primary" id="btn-cierre-papel"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;background:#4f46e5;border-color:#4f46e5;color:#fff;"
              onclick="abrirCierrePapel()"><i data-lucide="file-text" class="btn-icon"></i> Cierre en Papel</button>
            <button class="btn-primary" id="btn-completar-reporte"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;"
              onclick="completarReporteDesdeDetalle()"><i data-lucide="file-edit" class="btn-icon"></i> Llenar Reporte
              Técnico</button>
            <button class="btn-primary" id="btn-asignar-tecnicos"
              style="display:none; font-size:0.8rem;padding:0.4rem 0.8rem;align-items:center;gap:0.35rem;background:var(--accent);border-color:var(--accent);color:#fff;"
              onclick="abrirAsignarTecnicos()"><i data-lucide="users" class="btn-icon"></i> Asignar Técnicos</button>
            <button class="btn-secondary" id="btn-enviar-correo"
              style="font-size:0.8rem;padding:0.4rem 0.8rem;display:flex;align-items:center;gap:0.35rem;color:#10b981;border-color:#10b981;"
              onclick="enviarCorreoOrden()"><i data-lucide="mail" class="btn-icon"></i> Enviar</button>
            <button class="btn-secondary" id="btn-imprimir-orden"
              style="font-size:0.8rem;padding:0.4rem 0.8rem;display:flex;align-items:center;gap:0.35rem;"
              onclick="imprimirOrden()"><i data-lucide="printer" class="btn-icon"></i> Imprimir</button>
            <button class="modal-close" onclick="cerrarDetalle()">✕</button>
          </div>
        </div>
        <div class="modal-body" id="detalle-body"></div>
      </div>
    </div>
