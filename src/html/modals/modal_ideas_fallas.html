    <!-- MODAL IDEAS Y FALLAS -->
    <div class="modal-overlay" id="modal-idea-falla-overlay" onclick="cerrarModalIdeaFalla(event)">
      <div class="modal" style="max-width:500px;">
        <div class="modal-header">
          <h2 id="idea-falla-modal-title">Reportar Idea / Falla</h2>
          <button class="modal-close" onclick="cerrarModalIdeaFalla()">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-idea-falla" onsubmit="guardarIdeaFalla(event)">
            <div class="form-section">
              <div class="form-section-title"><i data-lucide="help-circle" class="section-icon"></i> Detalles del Registro</div>
              <div class="form-grid" style="grid-template-columns: 1fr;">
                
                <div class="form-group">
                  <label>Tipo *</label>
                  <div style="display:flex; gap:1.5rem; margin-top:0.35rem;">
                    <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-weight:normal; font-size:0.9rem; color:var(--text-primary);">
                      <input type="radio" name="if-tipo" value="Idea" checked style="width:16px; height:16px; margin:0;" />
                      Idea / Mejora
                    </label>
                    <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-weight:normal; font-size:0.9rem; color:var(--text-primary);">
                      <input type="radio" name="if-tipo" value="Falla" style="width:16px; height:16px; margin:0;" />
                      Falla / Bug
                    </label>
                  </div>
                </div>

                <div class="form-group">
                  <label>Título *</label>
                  <input type="text" id="if-titulo" placeholder="Ej. Filtro por técnico en gastos" required style="width:100%;" />
                </div>

                <div class="form-group">
                  <label>Descripción / Detalles</label>
                  <textarea id="if-descripcion" placeholder="Explica detalladamente la idea o el problema..." rows="4" style="width:100%; font-family:inherit; resize:vertical;"></textarea>
                </div>

                <div class="form-group">
                  <label style="display:flex; align-items:center; justify-content:space-between;">
                    <span>Archivos y Capturas Adjuntas</span>
                    <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">Imágenes, PDF, documentos</span>
                  </label>
                  <div style="border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 1rem; text-align: center; background: var(--bg-hover, #f8fafc); cursor: pointer; transition: border-color 0.2s;"
                       onclick="document.getElementById('if-file-input').click()"
                       ondragover="event.preventDefault(); this.style.borderColor='var(--accent)';"
                       ondragleave="this.style.borderColor='var(--border)';"
                       ondrop="window.handleIfFilesDrop(event)">
                    <i data-lucide="paperclip" style="width: 22px; height: 22px; color: var(--text-secondary); margin-bottom: 0.25rem;"></i>
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Haz clic o arrastra capturas/archivos aquí</div>
                    <div style="font-size: 0.72rem; color: var(--text-muted);">Soporta capturas JPG, PNG, PDF, Excel, Word</div>
                    <input type="file" id="if-file-input" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none;" onchange="window.handleIfFilesSelect(event)">
                  </div>
                  <div id="if-archivos-preview" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.6rem;"></div>
                </div>

                <div class="form-group">
                  <label>Módulo / Etiqueta del Sistema *</label>
                  <select id="if-modulo" class="view-filter" style="width:100%; margin:0;">
                    <option value="General" selected>General / Sistema</option>
                    <option value="Tickets">Tickets</option>
                    <option value="Levantamientos">Levantamientos</option>
                    <option value="Órdenes">Órdenes de Servicio</option>
                    <option value="Clientes">Clientes / SAP</option>
                    <option value="Gastos">Gastos / Clara</option>
                    <option value="Portal">Portal Clientes</option>
                    <option value="Calendario">Calendario</option>
                    <option value="UI">UI / Interfaz</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Prioridad *</label>
                  <select id="if-prioridad" class="view-filter" style="width:100%; margin:0;">
                    <option value="Baja">Baja</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                  </select>
                </div>

                <div class="form-group" id="if-estado-container" style="display:none;">
                  <label>Etapa / Estado</label>
                  <select id="if-estado" class="view-filter" style="width:100%; margin:0;" onchange="toggleIfResolucionInput()">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Análisis">En Análisis</option>
                    <option value="En Desarrollo">En Desarrollo</option>
                    <option value="En Pruebas">En Pruebas</option>
                    <option value="Resuelto">Resuelto</option>
                    <option value="Rechazado">Rechazado</option>
                  </select>
                </div>

                <div class="form-group" id="if-resolucion-container" style="display:none;">
                  <label style="color:#10b981; font-weight:700;">Explicación / Conclusión de la Solución</label>
                  <textarea id="if-resolucion" placeholder="Explica detalladamente cómo se resolvió esta idea o falla..." rows="3" style="width:100%; font-family:inherit; resize:vertical; border-color:rgba(16,185,129,0.4);"></textarea>
                </div>

              </div>
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
              <button type="button" class="btn-secondary" onclick="cerrarModalIdeaFalla()">Cancelar</button>
              <button type="submit" class="btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- MODAL CONCLUSIÓN / RESOLUCIÓN IDEAS Y FALLAS -->
    <div class="modal-overlay" id="modal-resolucion-idea-falla-overlay" onclick="window.cerrarModalResolucionIdeaFalla(event)">
      <div class="modal" style="max-width:500px;">
        <div class="modal-header" style="background: rgba(16, 185, 129, 0.08); border-bottom: 1px solid rgba(16, 185, 129, 0.2);">
          <h2 style="display:flex; align-items:center; gap:0.5rem; color:#10b981; margin:0; font-size:1.1rem;">
            <i data-lucide="check-circle-2" style="width:20px; height:20px;"></i>
            <span>Conclusión y Solución</span>
          </h2>
          <button class="modal-close" onclick="window.cerrarModalResolucionIdeaFalla()">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-resolucion-idea-falla" onsubmit="window.guardarResolucionIdeaFalla(event)">
            <input type="hidden" id="if-res-id" />
            <div class="form-group" style="margin-bottom:1rem; text-align:left;">
              <label style="font-size:0.88rem; font-weight:700; color:var(--text-primary); display:block; margin-bottom:0.2rem;">
                Explicación / Conclusión de la Solución *
              </label>
              <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:0.5rem; line-height:1.35;">
                Describe cómo se resolvió esta idea o falla para que quede registrada como referencia futura.
              </div>
              <textarea id="if-res-explicacion" rows="4" required placeholder="Ej. Se ajustó el algoritmo en backend y se actualizó la interfaz de usuario..."
                style="width:100%; font-family:inherit; padding:0.6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); color:var(--text-primary); resize:vertical; outline:none; font-size:0.88rem;"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.25rem;">
              <button type="button" class="btn-secondary" onclick="window.cerrarModalResolucionIdeaFalla()">Cancelar</button>
              <button type="submit" class="btn-primary" style="background:#10b981; border-color:#10b981;">
                <i data-lucide="check" style="width:16px; height:16px;"></i> Guardar y Marcar Resuelto
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
