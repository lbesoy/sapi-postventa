    <!-- MODAL BITÁCORA -->
    <div class="modal-overlay" id="modal-bitacora-overlay" onclick="cerrarBitacora(event)" style="z-index: 500;">
      <div class="modal" id="modal-bitacora" style="max-width:500px;">
        <div class="modal-header">
          <h2>Agregar Nota a Bitácora</h2>
          <button class="modal-close" onclick="cerrarBitacora()">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group full-width" style="margin-top:0.75rem;">
            <label>Fecha *</label>
            <input type="date" id="bitacora-fecha" required />
          </div>
          <div class="form-group full-width" style="margin-top:0.75rem;">
            <label>Nota / Avance del día *</label>
            <textarea id="bitacora-nota" rows="4" placeholder="Describe el trabajo realizado..." required></textarea>
          </div>
          <div class="form-group full-width" id="grupo-bitacora-horas" style="margin-top:0.75rem; display:flex; gap:1rem;">
            <div style="flex:1;">
              <label id="lbl-bitacora-entrada">Hora de Entrada *</label>
              <input type="time" id="bitacora-entrada" required />
            </div>
            <div style="flex:1;">
              <label id="lbl-bitacora-salida">Hora de Salida *</label>
              <input type="time" id="bitacora-salida" required />
            </div>
          </div>
          <div class="form-group full-width" id="grupo-bitacora-traslados" style="margin-top:0.75rem; display:flex; gap:1rem;">
            <div style="flex:1;" id="col-traslado-ida">
              <label>Horas Traslado (Ida)</label>
              <input type="number" id="bitacora-horas-traslado" step="0.5" min="0" placeholder="Ej. 1.5" />
            </div>
            <div style="flex:1;" id="col-traslado-regreso">
              <label>Horas Traslado (Regreso)</label>
              <input type="number" id="bitacora-horas-regreso" step="0.5" min="0" placeholder="Ej. 1.5" />
            </div>
          </div>
          <div class="form-actions" style="margin-top:1.5rem; justify-content:center;">
            <button class="btn-secondary" onclick="cerrarBitacora()">Cancelar</button>
            <button class="btn-primary" onclick="guardarNotaBitacora()">Guardar Nota</button>
          </div>
        </div>
      </div>
    </div>
