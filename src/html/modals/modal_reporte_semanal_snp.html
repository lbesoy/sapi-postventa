<!-- MODAL DOCUMENTO Y BITÁCORA SEMANAL DE SERVICIOS EN SITIO / FACTURACIÓN -->
<div class="modal-overlay" id="modal-reporte-semanal-snp-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99999; overflow-y: auto; align-items: flex-start; justify-content: center; padding: 1.5rem 1rem;">
  <div class="modal-card" style="background: var(--bg-card, #1e293b); border: 1px solid var(--border, #334155); border-radius: 16px; width: 100%; max-width: 960px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin: auto; overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Modal Header -->
    <div style="padding: 1.25rem 1.5rem; background: var(--bg-secondary, #0f172a); border-bottom: 1px solid var(--border, #334155); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(16,185,129,0.15); color: #10b981; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="file-text" style="width: 22px; height: 22px;"></i>
        </div>
        <div>
          <h3 style="margin: 0; font-size: 1.15rem; font-weight: 800; color: var(--text-primary);">
            Bitácora Semanal de Maquinaria y Horas Técnicas
          </h3>
          <span style="font-size: 0.78rem; color: var(--text-muted);">
            Documento de control semanal para bitácora en campo y conciliación / facturación de Bolsa de Horas
          </span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" class="btn-primary" onclick="window.imprimirReporteSemanalSNP()" style="font-size: 0.82rem; display: flex; align-items: center; gap: 0.4rem; background: #10b981; border-color: #10b981;">
          <i data-lucide="printer" style="width: 15px; height: 15px;"></i> Imprimir / Guardar PDF
        </button>
        <button type="button" class="btn-secondary" onclick="window.exportarReporteSemanalExcelSNP()" style="font-size: 0.82rem; display: flex; align-items: center; gap: 0.4rem;">
          <i data-lucide="download" style="width: 15px; height: 15px;"></i> Exportar Excel
        </button>
        <button type="button" onclick="window.cerrarModalReporteSemanalSNP()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 0.35rem; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
    </div>

    <!-- Filter Bar for Report Generator -->
    <div style="padding: 1rem 1.5rem; background: var(--bg-hover); border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
      <div class="form-group" style="min-width: 220px; flex: 1;">
        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem; display: block;">Contrato de Renta / Proyecto</label>
        <select id="snp-reporte-filtro-renta" onchange="window.actualizarReporteSemanalSNP()" style="width: 100%; padding: 0.45rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 0.85rem;">
          <option value="">-- Todos los Contratos / Proyectos --</option>
        </select>
      </div>

      <div class="form-group" style="min-width: 200px;">
        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem; display: block;">Semana de Facturación / Servicio</label>
        <select id="snp-reporte-filtro-semana" onchange="window.actualizarReporteSemanalSNP()" style="width: 100%; padding: 0.45rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 0.85rem; font-weight: 600;">
          <!-- Se puebla con las semanas del año -->
        </select>
      </div>

      <div class="form-group" style="min-width: 180px;">
        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem; display: block;">Filtrar por Maquinaria</label>
        <select id="snp-reporte-filtro-maquina" onchange="window.actualizarReporteSemanalSNP()" style="width: 100%; padding: 0.45rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 0.85rem;">
          <option value="">-- Todas las Máquinas --</option>
        </select>
      </div>
    </div>

    <!-- Printable Content Container -->
    <div style="padding: 1.5rem; max-height: calc(85vh - 200px); overflow-y: auto;">
      <div id="snp-reporte-semanal-documento" style="background: #ffffff; color: #0f172a; padding: 2rem; border-radius: 8px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <!-- Se puebla dinámicamente con JS con formato de documento formal -->
      </div>
    </div>

    <!-- Modal Footer -->
    <div style="padding: 1rem 1.5rem; background: var(--bg-secondary); border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
      <button type="button" class="btn-secondary" onclick="window.cerrarModalReporteSemanalSNP()">
        Cerrar
      </button>
    </div>
  </div>
</div>
