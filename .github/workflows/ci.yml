name: CI Tests & Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: SAPI Integrity & Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Auditoría Preventiva e Integridad (Check)
        run: npm run check

      - name: Ejecutar Pruebas Unitarias y de Integración (Test)
        run: npm test
