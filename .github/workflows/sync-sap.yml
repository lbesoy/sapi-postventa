name: Sync SAP → Supabase

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: 'Módulo a sincronizar (all, clientes, refacciones, sitios)'
        required: false
        default: 'all'
  schedule:
    - cron: '0 13 * * 1-5'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del backend
        run: cd backend && npm install

      - name: Ejecutar sincronización SAP → Supabase
        id: sap_sync
        continue-on-error: true
        env:
          SAP_SL_URL: ${{ secrets.SAP_SL_URL }}
          SAP_COMPANY_DB: ${{ secrets.SAP_COMPANY_DB }}
          SAP_USER: ${{ secrets.SAP_USER }}
          SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAP_REJECT_UNAUTHORIZED: 'false'
        run: |
          cd backend && node sync-sap-supabase.js

      - name: Verificar resultado de la sincronización
        if: always()
        run: |
          if [ "${{ steps.sap_sync.outcome }}" = "failure" ]; then
            echo "::warning title=Conexión SAP no disponible::El script de sincronización no pudo conectarse con SAP Service Layer o finalizó con errores de red."
          else
            echo "::notice title=Sincronización Exitosa::Sincronización SAP → Supabase completada exitosamente."
          fi
